<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Panel Jefe HE — CALAROTA, LUCIANA</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0f0f;--sf:#1a1a1a;--s2:#222;--bd:#2e2e2e;
  --ac:#c8f542;--ad:#0f0f0f;--tx:#f0f0f0;--mu:#d6d6d6;--dm:#666;
  --red:#ff5a5a;--redbg:rgba(255,90,90,.09);--redbd:rgba(255,90,90,.3);
  --amber:#f5a623;--ambg:rgba(245,166,35,.09);--ambd:rgba(245,166,35,.3);
  --green:#4caf50;--grbg:rgba(76,175,80,.09);--grbd:rgba(76,175,80,.3);
  --blue:#64b5f6;--blbg:rgba(100,181,246,.09);--blbd:rgba(100,181,246,.3);
  --r:12px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:14px;padding-bottom:20px}
.topbar{background:var(--sf);border-bottom:1px solid var(--bd);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100}
.tb-left{display:flex;align-items:center;gap:10px}
.dot{width:9px;height:9px;background:var(--ac);border-radius:50%}
.tb-title{font-size:14px;font-weight:600}
.tb-right{display:flex;align-items:center;gap:8px}
.btn-refresh{background:rgba(200,245,66,.15);border:1px solid rgba(200,245,66,.3);color:var(--ac);border-radius:6px;padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.tb-mes{font-family:'DM Mono',monospace;font-size:10px;color:var(--mu);letter-spacing:.06em}

.main{padding:16px}

/* RESUMEN */
.resumen-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.rcard{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px}
.rcard-lbl{font-size:10px;color:var(--mu);margin-bottom:4px;font-family:'DM Mono',monospace;text-transform:uppercase}
.rcard-val{font-size:22px;font-weight:600;line-height:1}
.rcard-val.green{color:var(--green)}.rcard-val.amber{color:var(--amber)}.rcard-val.red{color:var(--red)}
.rcard-sub{font-size:10px;color:var(--mu);margin-top:3px;font-family:'DM Mono',monospace}

/* FILTROS */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fp{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--mu);transition:all .1s}
.fp.active{background:var(--ac);border-color:var(--ac);color:var(--ad)}

/* MESES ABIERTOS — un mes se sigue viendo hasta que coordinación lo cierra */
.meses{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.mp{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--mu);transition:all .1s}
.mp.active{background:var(--ac);border-color:var(--ac);color:var(--ad)}
.mp small{font-weight:500;opacity:.8}
.mp-sel{padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--bd);background:var(--sf);color:var(--mu);font-family:'DM Sans',sans-serif;cursor:pointer;max-width:100%}
.mp-sel.active{border-color:var(--ac);color:var(--ac)}
.mes-nota{font-size:12px;color:var(--mu);margin-bottom:14px;line-height:1.4}

/* BUSCADOR + ORDEN */
.buscar-row{display:flex;gap:8px;margin-bottom:12px}
.buscar-row input{flex:1;min-width:0;background:var(--sf);border:1px solid var(--bd);border-radius:var(--rs);padding:10px 12px;color:var(--tx);font-size:14px;font-family:'DM Sans',sans-serif}
.buscar-row input:focus{outline:none;border-color:var(--ac)}
.buscar-row select{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rs);padding:8px 8px;color:var(--mu);font-size:12px;font-family:'DM Sans',sans-serif;max-width:46%}
.grupo-persona{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12px;color:var(--mu);font-family:'DM Mono',monospace;margin:14px 2px 6px;padding-bottom:4px;border-bottom:1px solid var(--bd)}
.grupo-persona strong{color:var(--tx);font-family:'DM Sans',sans-serif;font-size:13px}

/* TICKET CARDS */
.ticket{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:10px;overflow:hidden;transition:border-color .15s}
.ticket.aprobado{border-color:var(--grbd)}
.ticket.rechazado{border-color:var(--redbd)}
.ticket.pendiente{border-color:var(--ambd)}
.ticket-head{padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;user-select:none}
.ticket-nombre{font-weight:600;font-size:14px}
.ticket-meta{font-size:11px;color:var(--mu);font-family:'DM Mono',monospace;margin-top:2px}
.ticket-monto{font-weight:700;font-family:'DM Mono',monospace;white-space:nowrap}
.ticket-monto.green{color:var(--green)}.ticket-monto.amber{color:var(--amber)}
.ticket-body{display:none;border-top:1px solid var(--bd);padding:12px 14px}
.ticket-body.open{display:block}
.det-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--bd)}
.det-row:last-child{border-bottom:none}
.det-l{color:var(--mu)}
.det-r{font-weight:500;text-align:right;max-width:65%;word-break:break-word}
.ticket-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* STATUS BADGE */
.sbadge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;font-family:'DM Mono',monospace;white-space:nowrap}
.sbadge.pendiente{background:var(--ambg);color:var(--amber);border:1px solid var(--ambd)}
.sbadge.aprobado{background:var(--grbg);color:var(--green);border:1px solid var(--grbd)}
.sbadge.rechazado{background:var(--redbg);color:var(--red);border:1px solid var(--redbd)}
.sdot{width:5px;height:5px;border-radius:50%;background:currentColor}

/* BTNS */
.btn{padding:8px 14px;border-radius:var(--rs);font-size:13px;font-weight:600;cursor:pointer;border:1px solid;font-family:'DM Sans',sans-serif;transition:all .1s}
.btn:active{transform:scale(.97)}
.btn.aprobar{background:var(--grbg);border-color:var(--grbd);color:var(--green)}
.btn.rechazar{background:var(--redbg);border-color:var(--redbd);color:var(--red)}
.btn.editar{background:var(--ambg);border-color:var(--ambd);color:var(--amber)}
.btn.ghost{background:transparent;border-color:var(--bd);color:var(--mu)}

/* EDIT INLINE */
.edit-panel{background:var(--s2);border:1px solid var(--ambd);border-radius:var(--rs);padding:12px;margin-top:10px;display:none}
.edit-panel.open{display:block}
.edit-field{margin-bottom:10px}
.edit-field label{display:block;font-size:11px;color:var(--mu);margin-bottom:4px;font-weight:500}
.edit-field input,.edit-field select,.edit-field textarea{width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:var(--rs);color:var(--tx);font-family:'DM Sans',sans-serif;font-size:13px;padding:8px 10px;outline:none}
.edit-field input:focus,.edit-field select:focus,.edit-field textarea:focus{border-color:var(--ac)}
.edit-field textarea{resize:none;height:60px;line-height:1.5}
.edit-btns{display:flex;gap:8px}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--mu);font-size:13px;line-height:1.8}
.empty-icon{font-size:36px;margin-bottom:10px}

/* LOADING */
.loading{text-align:center;padding:40px 20px;color:var(--mu)}
.spinner{width:32px;height:32px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-left">
    <div class="dot"></div>
    <div>
      <div class="tb-title" id="tb-nombre">Panel Jefe</div>
      <div class="tb-mes" id="tb-area"></div>
    </div>
  </div>
  <div class="tb-right">
    <button class="btn-refresh" id="btn-refresh" onclick="cargarTickets()">↻ Actualizar</button>
  </div>
</div>

<div class="main">
  <div class="meses" id="meses-pills"></div>
  <div class="mes-nota" id="mes-nota"></div>
  <div class="resumen-grid">
    <div class="rcard"><div class="rcard-lbl">Pendientes</div><div class="rcard-val amber" id="r-pendientes">—</div><div class="rcard-sub">para revisar</div></div>
    <div class="rcard"><div class="rcard-lbl">Aprobados</div><div class="rcard-val green" id="r-aprobados">—</div><div class="rcard-sub">en el mes</div></div>
    <div class="rcard"><div class="rcard-lbl">Total</div><div class="rcard-val" id="r-total" style="font-size:16px">—</div><div class="rcard-sub">acumulado</div></div>
  </div>

  <div class="filters">
    <div class="fp active" id="f-todos" onclick="setFiltro('todos',this)">Todos</div>
    <div class="fp" id="f-pendiente" onclick="setFiltro('pendiente',this)">Pendientes</div>
    <div class="fp" id="f-aprobado" onclick="setFiltro('aprobado',this)">Aprobados</div>
    <div class="fp" id="f-rechazado" onclick="setFiltro('rechazado',this)">Rechazados</div>
  </div>

  <div class="buscar-row">
    <input type="search" id="buscar" placeholder="🔍 Buscar persona, producción o descripción…" oninput="buscar=this.value;renderTickets();actualizarResumen()">
    <select id="orden" onchange="orden=this.value;renderTickets()" title="Cómo ordenar los tickets">
      <option value="estado">Pendientes primero</option>
      <option value="persona">Por persona</option>
      <option value="fecha">Por fecha</option>
    </select>
  </div>

  <div id="tickets-container">
    <div class="loading"><div class="spinner"></div>Cargando tickets...</div>
  </div>
</div>

<script>
window.JEFE_CONFIG = {
  nombre: 'CALAROTA, LUCIANA',
  areas:  ["SALA"],
  teatro: 'MET',
};
</script>
<script>
// ═══════════════════════════════════════
// CONFIGURACIÓN DEL JEFE — SE SOBREESCRIBE EN CADA ARCHIVO
// ═══════════════════════════════════════
const JEFE_CONFIG = window.JEFE_CONFIG || {
  nombre: 'JEFE',
  areas:  [],
  teatro: '',
};

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxLU3Adp7TbOR_hwPd2fsR72Fwo9-qOT8lYNeuUnk16o9vsxnr-SZRHVRIyamXmXhxE/exec";

async function apiGet(action, params={}) {
  try {
    const url = new URL(SCRIPT_URL);
    url.searchParams.set("action", action);
    Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
    const res = await fetch(url.toString());
    return await res.json();
  } catch(e) { return {ok:false, error:e.toString()}; }
}

async function apiPost(action, data) {
  try {
    const payload = encodeURIComponent(JSON.stringify({action, data}));
    const res = await fetch(`${SCRIPT_URL}?payload=${payload}`);
    return await res.json();
  } catch(e) { return {ok:false, error:e.toString()}; }
}

// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
let tickets = [];
let filtro = 'todos';
let buscar = '';        // texto del buscador
let orden = 'estado';   // 'estado' | 'persona' | 'fecha'

// Texto para comparar: sin acentos ni mayúsculas
function normTxt(s){return String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
// ¿El ticket coincide con lo que se escribió en el buscador? (todas las palabras)
function coincide(t){
  const q = normTxt(buscar).trim();
  if (!q) return true;
  const donde = normTxt([t.nombre, t.obra, t.descripcion, t.tipoLabel, fmtF(t.fecha)].join(' '));
  return q.split(/\s+/).every(p => donde.includes(p));
}

// ═══════════════════════════════════════
// MESES ABIERTOS
// ═══════════════════════════════════════
// REGLA: un mes NO desaparece el día 1 del siguiente. Se sigue viendo —y
// aprobando— hasta que coordinación lo cierra. El panel muestra una
// pastilla por cada mes que siga abierto, más el mes en curso.
// (Bug anterior: solo se pedía el mes calendario, así que el 1° de octubre
// los tickets de septiembre pendientes de aprobar dejaban de verse.)
const PRIMER_MES = '2026-09'; // primer mes real del sistema
let MESES_CERRADOS = [];      // [{mes:'2026-09', teatro:'MET'}, ...]
let mesesVisibles = [];       // meses abiertos — con pastilla
let mesesCerradosMios = [];   // meses ya cerrados para este jefe — se consultan desde el desplegable
let mesesHistorial = [];      // meses cerrados que el jefe abrió para consultar en esta sesión
let mesSel = null;            // mes en pantalla
let mesSelManual = false;     // true si el jefe lo eligió a mano

function mesK(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
function mkSumar(mk,n){const[y,m]=mk.split('-').map(Number);return mesK(new Date(y,m-1+n,1));}
function mkNombre(mk){const[y,m]=mk.split('-').map(Number);const n=new Date(y,m-1,1,12).toLocaleString('es-AR',{month:'long'});return n.charAt(0).toUpperCase()+n.slice(1);}
function mkLista(desde,hasta){const out=[];for(let mk=desde;mk<=hasta&&out.length<240;mk=mkSumar(mk,1))out.push(mk);return out;}
function teatrosJefe(){return (!JEFE_CONFIG.teatro||JEFE_CONFIG.teatro==='AMBOS')?['MET','PLP']:[JEFE_CONFIG.teatro];}
function mesCerrado(mk,teatro){return MESES_CERRADOS.some(m=>m.mes===mk&&(m.teatro===teatro||m.teatro==='AMBOS'));}
// Para un jefe de ambos teatros, el mes sigue abierto mientras alguno de los dos no haya cerrado
function mesCerradoParaMi(mk){return teatrosJefe().every(t=>mesCerrado(mk,t));}
function ticketCerrado(t){return mesCerrado(t.mes,(t.teatro||'').toUpperCase());}

function setMes(mk){
  mesSel = mk;
  mesSelManual = true;
  renderMeses(); renderTickets(); actualizarResumen();
}

// Meses ya cerrados: no se pierden. Se eligen del desplegable y se ven
// completos, pero solo para consultar (sin aprobar / rechazar / editar).
async function verMesCerrado(mk){
  if (!mk) return;
  if (!mesesHistorial.includes(mk)) mesesHistorial.push(mk);
  mesSel = mk;
  mesSelManual = true;
  document.getElementById('tickets-container').innerHTML = `<div class="loading"><div class="spinner"></div>Cargando ${mkNombre(mk).toLowerCase()}...</div>`;
  await cargarTickets();
}

function renderMeses(){
  const actual = mesK(new Date());
  const viendoCerrado = !!mesSel && mesesCerradosMios.includes(mesSel);
  const selCerrados = mesesCerradosMios.length
    ? `<select class="mp-sel ${viendoCerrado?'active':''}" onchange="verMesCerrado(this.value)" title="Consultar un mes ya cerrado">
        <option value="">Meses cerrados…</option>
        ${mesesCerradosMios.slice().reverse().map(mk => `<option value="${mk}" ${mk===mesSel?'selected':''}>${mkNombre(mk)} ${mk.slice(0,4)} · cerrado</option>`).join('')}
      </select>`
    : '';
  document.getElementById('meses-pills').innerHTML = mesesVisibles.map(mk => {
    const pend = tickets.filter(t => t.mes===mk && t.aprobJefe==='PENDIENTE' && !ticketCerrado(t)).length;
    const estado = mk<actual ? 'falta cerrar' : 'en curso';
    return `<div class="mp ${mk===mesSel?'active':''}" onclick="setMes('${mk}')">${mkNombre(mk)} <small>· ${estado}${pend?` · ${pend} pend.`:''}</small></div>`;
  }).join('') + selCerrados;
  const nota = document.getElementById('mes-nota');
  if (viendoCerrado) {
    nota.textContent = `${mkNombre(mesSel)} ${mesSel.slice(0,4)} está cerrado: lo podés consultar completo, pero ya no se puede modificar.`;
  } else if (mesSel && mesSel < actual) {
    nota.textContent = `${mkNombre(mesSel)} ya terminó, pero sigue abierto hasta que coordinación lo cierre: todavía podés aprobar, rechazar y corregir.`;
  } else if (mesesVisibles.length > 1) {
    nota.textContent = `Ojo: ${mkNombre(mesesVisibles[0])} todavía no se cerró — revisá si te quedó algo pendiente ahí.`;
  } else {
    nota.textContent = '';
  }
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
window.onload = async () => {
  document.getElementById('tb-nombre').textContent = JEFE_CONFIG.nombre;
  document.getElementById('tb-area').textContent =
    JEFE_CONFIG.areas.join(' + ') + (JEFE_CONFIG.teatro ? ' · ' + JEFE_CONFIG.teatro : '');
  await cargarTickets();
  // Auto-refresh cada 3 minutos
  setInterval(cargarTickets, 3 * 60 * 1000);
};

// Parseo seguro: números planos ("16411" o "13044.38") vía parseFloat
// directo; solo se limpia separador de miles si viene con coma decimal
// estilo argentino. (Antes: sacaba puntos a ciegas y convertía 13044.38
// en 1304438 — mismo bug que tenía el formulario.)
function parseValorJ(raw) {
  if (typeof raw === 'number') return raw;
  const s = String(raw ?? '0').trim();
  if (s.includes(',')) return parseFloat(s.replace(/\./g, '').replace(',', '.')) || 0;
  return parseFloat(s) || 0;
}

async function cargarTickets() {
  const btn = document.getElementById('btn-refresh');
  btn.textContent = '⏳';
  btn.disabled = true;

  try {
    const actual = mesK(new Date());
    const desde = PRIMER_MES <= actual ? PRIMER_MES : actual;

    // 1) Qué meses cerró coordinación
    const mRes = await apiGet('getMeses');
    const mesesOk = mRes.ok && Array.isArray(mRes.data);
    if (mesesOk) {
      MESES_CERRADOS = mRes.data.map(m => ({mes: String(m['Mes']||'').slice(0,7), teatro: m['Teatro']||'AMBOS'}));
    }
    // 2) Meses a mostrar: los que siguen abiertos + el mes en curso. Si no se
    //    pudo leer qué está cerrado, por las dudas: el mes anterior y el actual.
    const mesesAb = mesesOk
      ? mkLista(desde, actual).filter(mk => mk === actual || !mesCerradoParaMi(mk))
      : [mkSumar(actual,-1), actual].filter(mk => mk >= desde);
    // Meses ya cerrados (para consulta) + los que el jefe abrió para mirar
    if (mesesOk) mesesCerradosMios = mkLista(desde, actual).filter(mk => mk !== actual && mesCerradoParaMi(mk));
    mesesHistorial = mesesHistorial.filter(mk => mesesCerradosMios.includes(mk));
    const meses = mesesAb.concat(mesesHistorial);
    // 3) Los tickets de cada uno de esos meses
    const resps = await Promise.all(meses.map(mes => apiGet('getRegistros', {mes})));

    if (resps.every(res => res.ok && Array.isArray(res.data))) {
      mesesVisibles = mesesAb;
      // Por defecto: el mes más viejo que siga abierto (lo que hay que
      // resolver primero). Si el jefe eligió uno a mano, se respeta.
      if (!mesSelManual || !meses.includes(mesSel)) { mesSel = mesesAb[0]; mesSelManual = false; }
      const abiertos = new Set(tickets.filter(t => t._open).map(t => t.id)); // no cerrarle al jefe lo que tenía desplegado
      // Filtrar solo los tickets del área/teatro de este jefe
      tickets = [].concat(...resps.map(res => res.data))
        .filter(r => {
          const area = r["Área(s)"] || r["Areas"] || r["Área"] || "";
          const teatro = r["Teatro"] || "";
          const areaMatch = JEFE_CONFIG.areas.some(a =>
            area.toUpperCase().includes(a.toUpperCase())
          );
          const teatroMatch = !JEFE_CONFIG.teatro || JEFE_CONFIG.teatro === 'AMBOS' ||
            teatro.toUpperCase() === JEFE_CONFIG.teatro.toUpperCase();
          return areaMatch && teatroMatch;
        })
        .map(r => ({
          id:          r["ID"] || "",
          nombre:      r["Nombre"] || "",
          area:        r["Área(s)"] || r["Areas"] || r["Área"] || "",
          teatro:      r["Teatro"] || "",
          sala:        r["Sala"] || "",
          fecha:       normFecha(r["Fecha"] || ""),
          horaDesde:   normHora(r["Hora Desde"] || ""),
          horaHasta:   normHora(r["Hora Hasta"] || ""),
          tipoLabel:   r["Tipo HE"] || "",
          horas:       parseFloat(r["Horas"]) || null,
          total:       parseValorJ(r["Total"]),
          obra:        r["Obra"] || "",
          descripcion: r["Descripción"] || r["Descripcion"] || "",
          aprobJefe:   r["Aprobado Jefe"] || "PENDIENTE",
          notaJefe:    r["Nota Jefe"] || "",
          sinValidar:  r["Sin Validar"] === "SI",
          overrideOverlap: r["Override Overlap"] === "SI",
          _open:       abiertos.has(r["ID"] || ""),
          _editOpen:   false,
        }))
        .map(t => Object.assign(t, {mes: (t.fecha||'').slice(0,7)}));
    }
  } catch(e) {
    console.error(e);
  }

  btn.textContent = '↻ Actualizar';
  btn.disabled = false;
  renderMeses();
  renderTickets();
  actualizarResumen();
}

// ═══════════════════════════════════════
// RENDER
// ═══════════════════════════════════════
function renderTickets() {
  const container = document.getElementById('tickets-container');
  const prioridad = {PENDIENTE:0, RECHAZADO:1, APROBADO:2};
  const porEstado  = (a,b) => (prioridad[a.aprobJefe]||0) - (prioridad[b.aprobJefe]||0) || b.fecha.localeCompare(a.fecha);
  const porPersona = (a,b) => a.nombre.localeCompare(b.nombre) || a.fecha.localeCompare(b.fecha) || String(a.horaDesde).localeCompare(String(b.horaDesde));
  const porFecha   = (a,b) => b.fecha.localeCompare(a.fecha) || a.nombre.localeCompare(b.nombre);
  let lista = tickets.filter(t => t.mes === mesSel && coincide(t))
    .sort(orden === 'persona' ? porPersona : orden === 'fecha' ? porFecha : porEstado);
  if (filtro !== 'todos') {
    lista = lista.filter(t => t.aprobJefe.toLowerCase() === filtro);
  }
  if (!lista.length && normTxt(buscar).trim()) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div>Nada coincide con "${buscar.replace(/</g,'&lt;')}" en ${mesSel?mkNombre(mesSel).toLowerCase():'el mes'}.</div>`;
    return;
  }
  if (!lista.length) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">${filtro==='aprobado'?'✅':filtro==='rechazado'?'❌':'📭'}</div>${filtro==='todos'?`Sin tickets en ${mesSel?mkNombre(mesSel).toLowerCase():'el mes'} para tu área.`:'Sin tickets en esta categoría.'}</div>`;
    return;
  }
  if (orden === 'persona') {
    // Agrupado: un encabezado por persona con su cantidad y su total
    let html = '', actual = null;
    lista.forEach((t,i) => {
      if (t.nombre !== actual) {
        actual = t.nombre;
        const suyos = lista.filter(x => x.nombre === actual);
        const pend = suyos.filter(x => x.aprobJefe === 'PENDIENTE').length;
        html += `<div class="grupo-persona"><strong>${actual}</strong><span>${suyos.length} ticket${suyos.length===1?'':'s'}${pend?` · ${pend} pend.`:''} · $${fmt(suyos.reduce((a,x)=>a+x.total,0))}</span></div>`;
      }
      html += ticketHTML(t, i);
    });
    container.innerHTML = html;
    return;
  }
  container.innerHTML = lista.map((t,i) => ticketHTML(t, i)).join('');
}

function ticketHTML(t, i) {
  const idx = tickets.indexOf(t);
  const estadoClass = t.aprobJefe === 'APROBADO' ? 'aprobado' : t.aprobJefe === 'RECHAZADO' ? 'rechazado' : 'pendiente';
  const montoClass = t.total > 100000 ? 'amber' : 'green';
  return `
  <div class="ticket ${estadoClass}" id="ticket-${idx}">
    <div class="ticket-head" onclick="toggleTicket(${idx})">
      <div>
        <div class="ticket-nombre">${t.nombre}</div>
        <div class="ticket-meta">${fmtF(t.fecha)} · ${t.horaDesde||'—'}→${t.horaHasta||'—'} · ${t.tipoLabel||'—'}${t.overrideOverlap?' · <span style="color:var(--red);font-weight:600">⚠ Solapa</span>':''}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <div class="ticket-monto ${montoClass}">$${fmt(t.total)}</div>
        <div class="sbadge ${estadoClass}"><span class="sdot"></span>${estadoBadge(t.aprobJefe)}</div>
      </div>
    </div>
    <div class="ticket-body ${t._open?'open':''}" id="tbody-${idx}">
      <div class="det-row"><span class="det-l">Teatro · Sala</span><span class="det-r">${t.teatro} · ${t.sala||'—'}</span></div>
      <div class="det-row"><span class="det-l">Obra</span><span class="det-r">${t.obra||'—'}</span></div>
      <div class="det-row"><span class="det-l">Descripción</span><span class="det-r">${t.descripcion||'—'}</span></div>
      <div class="det-row"><span class="det-l">Horas</span><span class="det-r">${t.horas!=null?t.horas+'hs':'—'}</span></div>
      ${t.notaJefe ? `<div class="det-row"><span class="det-l">Tu nota</span><span class="det-r" style="color:var(--amber)">${t.notaJefe}</span></div>` : ''}
      ${ticketCerrado(t) ? `<div class="det-row"><span class="det-l">🔒 Mes cerrado por coordinación</span><span class="det-r">ya no se puede modificar</span></div>` : `<div class="ticket-actions">
        ${t.aprobJefe !== 'APROBADO' ? `<button class="btn aprobar" onclick="aprobar(${idx})">✓ Aprobar</button>` : ''}
        ${t.aprobJefe !== 'RECHAZADO' ? `<button class="btn rechazar" onclick="rechazar(${idx})">✗ Rechazar</button>` : ''}
        <button class="btn editar" onclick="toggleEditar(${idx})">✎ Editar</button>
        ${t.aprobJefe !== 'APROBADO' ? '' : `<button class="btn ghost" onclick="desaprobar(${idx})">Revertir</button>`}
      </div>`}
      <div class="edit-panel ${t._editOpen?'open':''}" id="edit-${idx}">
        <div class="edit-field"><label>Fecha</label><input type="date" id="ef-fecha-${idx}" value="${t.fecha}"></div>
        <div class="edit-field"><label>Hora desde</label>
          <select id="ef-desde-${idx}">${horaOpts(t.horaDesde)}</select>
        </div>
        <div class="edit-field"><label>Hora hasta</label>
          <select id="ef-hasta-${idx}">${horaOpts(t.horaHasta)}</select>
        </div>
        <div class="edit-field"><label>Descripción</label><textarea id="ef-desc-${idx}">${t.descripcion}</textarea></div>
        <div class="edit-field"><label>Motivo de la corrección <span style="color:var(--red)">*</span></label>
          <textarea id="ef-motivo-${idx}" placeholder="Explicá qué corregiste y por qué."></textarea>
        </div>
        <div class="edit-btns">
          <button class="btn aprobar" onclick="guardarEdicion(${idx})">Guardar y aprobar</button>
          <button class="btn ghost" onclick="toggleEditar(${idx})">Cancelar</button>
        </div>
      </div>
    </div>
  </div>`;
}

function estadoBadge(s) {
  return s === 'APROBADO' ? '✓ Aprobado' : s === 'RECHAZADO' ? '✗ Rechazado' : '⏳ Pendiente';
}

function actualizarResumen() {
  const delMes     = tickets.filter(t => t.mes === mesSel && coincide(t)); // con buscador: los números de lo que se está viendo
  const pendientes = delMes.filter(t => t.aprobJefe === 'PENDIENTE').length;
  const aprobados  = delMes.filter(t => t.aprobJefe === 'APROBADO').length;
  const total      = delMes.reduce((a,t) => a + t.total, 0);
  renderMeses();
  document.getElementById('r-pendientes').textContent = pendientes;
  document.getElementById('r-aprobados').textContent  = aprobados;
  document.getElementById('r-total').textContent      = '$' + fmt(total);
}

// ═══════════════════════════════════════
// ACCIONES
// ═══════════════════════════════════════
async function aprobar(idx) {
  const t = tickets[idx];
  if (!t.id) { alert('Este ticket no tiene ID — no se puede sincronizar.'); return; }
  const estadoPrevio = t.aprobJefe;
  t.aprobJefe = 'APROBADO';
  renderTickets(); actualizarResumen();
  const r = await apiPost('aprobarTicket', {
    id: t.id,
    aprobadoPor: JEFE_CONFIG.nombre,
    estado: 'APROBADO',
    nota: '',
  });
  if (!r.ok) {
    t.aprobJefe = estadoPrevio; // revertir — el servidor no lo aceptó
    renderTickets(); actualizarResumen();
    alert(`No se pudo aprobar: ${r.error||'error desconocido'}`);
  }
}

async function rechazar(idx) {
  const nota = prompt('¿Por qué rechazás este ticket? (obligatorio)');
  if (!nota || !nota.trim()) return;
  const t = tickets[idx];
  const estadoPrevio = t.aprobJefe, notaPrevia = t.notaJefe;
  t.aprobJefe = 'RECHAZADO';
  t.notaJefe = nota.trim();
  renderTickets(); actualizarResumen();
  const r = await apiPost('aprobarTicket', {
    id: t.id,
    aprobadoPor: JEFE_CONFIG.nombre,
    estado: 'RECHAZADO',
    nota: nota.trim(),
  });
  if (!r.ok) {
    t.aprobJefe = estadoPrevio; t.notaJefe = notaPrevia;
    renderTickets(); actualizarResumen();
    alert(`No se pudo rechazar: ${r.error||'error desconocido'}`);
  }
}

async function desaprobar(idx) {
  if (!confirm('¿Revertir la aprobación de este ticket?')) return;
  const t = tickets[idx];
  const estadoPrevio = t.aprobJefe, notaPrevia = t.notaJefe;
  t.aprobJefe = 'PENDIENTE';
  t.notaJefe = '';
  renderTickets(); actualizarResumen();
  const r = await apiPost('aprobarTicket', {
    id: t.id,
    aprobadoPor: JEFE_CONFIG.nombre,
    estado: 'PENDIENTE',
    nota: '',
  });
  if (!r.ok) {
    t.aprobJefe = estadoPrevio; t.notaJefe = notaPrevia;
    renderTickets(); actualizarResumen();
    alert(`No se pudo revertir: ${r.error||'error desconocido'}`);
  }
}

async function guardarEdicion(idx) {
  const t = tickets[idx];
  const motivo = document.getElementById(`ef-motivo-${idx}`).value.trim();
  if (!motivo) { alert('El motivo es obligatorio.'); return; }
  const previo = {fecha:t.fecha, horaDesde:t.horaDesde, horaHasta:t.horaHasta, descripcion:t.descripcion, aprobJefe:t.aprobJefe};
  const nuevoFecha = document.getElementById(`ef-fecha-${idx}`).value || t.fecha;
  const nuevoDesde  = document.getElementById(`ef-desde-${idx}`).value || t.horaDesde;
  const nuevoHasta  = document.getElementById(`ef-hasta-${idx}`).value || t.horaHasta;
  const nuevaDesc   = document.getElementById(`ef-desc-${idx}`).value.trim() || t.descripcion;
  // Guardar en el servidor PRIMERO — solo tocamos la vista si se confirma
  const r1 = await apiPost('editRegistro', {
    id: t.id, fecha: nuevoFecha, horaDesde: nuevoDesde, horaHasta: nuevoHasta,
    descripcion: nuevaDesc, motivo, editadoPor: JEFE_CONFIG.nombre,
  });
  if (!r1.ok) { alert(`No se pudo guardar la edición: ${r1.error||'error desconocido'}`); return; }
  t.fecha=nuevoFecha; t.horaDesde=nuevoDesde; t.horaHasta=nuevoHasta; t.descripcion=nuevaDesc;
  t.aprobJefe = 'APROBADO';
  t._editOpen = false;
  const r2 = await apiPost('aprobarTicket', {
    id: t.id, aprobadoPor: JEFE_CONFIG.nombre, estado: 'APROBADO',
    nota: `Editado y aprobado: ${motivo}`,
  });
  if (!r2.ok) { t.aprobJefe = previo.aprobJefe; alert(`Se guardó la edición, pero no se pudo aprobar: ${r2.error||'error desconocido'}`); }
  renderTickets(); actualizarResumen();
}

function toggleTicket(idx) {
  tickets[idx]._open = !tickets[idx]._open;
  const body = document.getElementById(`tbody-${idx}`);
  if (body) body.classList.toggle('open', tickets[idx]._open);
}

function toggleEditar(idx) {
  tickets[idx]._editOpen = !tickets[idx]._editOpen;
  const panel = document.getElementById(`edit-${idx}`);
  if (panel) panel.classList.toggle('open', tickets[idx]._editOpen);
}

function setFiltro(f, el) {
  filtro = f;
  document.querySelectorAll('.fp').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  renderTickets();
}

// ═══════════════════════════════════════
// UTILS
// ═══════════════════════════════════════
function horaOpts(sel) {
  let html = '';
  for (let h = 0; h < 24; h++) {
    for (let m of [0, 30]) {
      const v = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      html += `<option value="${v}" ${v===sel?'selected':''}>${v}</option>`;
    }
  }
  return html;
}
function normHora(v){if(!v)return'';const s=String(v);const m=s.match(/T(\d{2}:\d{2})/);if(m)return m[1];const m2=s.match(/^(\d{2}:\d{2})/);if(m2)return m2[1];return s;}
function normFecha(v){if(!v)return'';const s=String(v);const m=s.match(/^(\d{4}-\d{2}-\d{2})/);return m?m[1]:s;}
function fmtF(v){if(!v)return'—';const[y,mo,d]=v.split('-');return`${d}/${mo}/${y}`;}
function fmt(n){return Math.round(n||0).toLocaleString('es-AR');}
